<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de reglas</title>
<style>body{font:15px/1.4 system-ui,sans-serif;margin:0;padding:16px;max-width:720px;margin-inline:auto}
button{font:inherit;font-size:16px;padding:12px 18px;border-radius:8px;border:0;background:#0102AF;color:#fff;width:100%}
table{border-collapse:collapse;width:100%;margin-top:14px}td,th{border-bottom:1px solid #ddd;padding:8px;text-align:left;vertical-align:top;font-size:14px}
.ok{color:#2E7D32;font-weight:700}.mal{color:#c0392b;font-weight:700}#res{margin-top:14px;font-weight:700}</style></head>
<body><h1 style="font-size:20px">Prueba de reglas de seguridad</h1>
<p>Entra como usuario anónimo (como un médico sin cuenta) y prueba qué le permiten y qué le prohíben las reglas. Esta página es temporal: se borra al terminar.</p>
<button id="go">Ejecutar pruebas</button><div id="res"></div><table id="t"></table>
<script type="module">
import { firebaseConfig } from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, doc, getDoc, getDocs, collection, setDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=initializeFirestore(app,{experimentalAutoDetectLongPolling:true});
const base=(uid)=>({tipo:"Personalizada",estado:"Solicitada",servicio:"SERVICIO PRUEBA",especialidad:"PRUEBA",tema:"PRUEBA DE REGLAS - ignorar",solicitante:"Prueba Reglas",fechaPreferida:"2027-03-09",horaPreferida:"11:00",createdAt:serverTimestamp(),autorUid:uid,origen:"manual"});
async function intento(fn){try{await fn();return "permitido"}catch(e){return (e&&e.code==="permission-denied")?"denegado":"error: "+(e&&e.code||e)}}
document.getElementById("go").onclick=async()=>{
 const t=document.getElementById("t"),res=document.getElementById("res");t.innerHTML="";res.textContent="Ejecutando…";
 const uid=(await signInAnonymously(auth)).user.uid, id="PRUEBA"+Math.random().toString(36).slice(2,7).toUpperCase();
 const casos=[
  ["Leer el catálogo (público)","permitido",()=>getDoc(doc(db,"config","catalogo"))],
  ["Leer una solicitud","denegado",()=>getDoc(doc(db,"solicitudes","X"))],
  ["Listar todas las solicitudes","denegado",()=>getDocs(collection(db,"solicitudes"))],
  ["Crearse como admin en /equipo","denegado",()=>setDoc(doc(db,"equipo",uid),{rol:"admin"})],
  ["Modificar el catálogo","denegado",()=>setDoc(doc(db,"config","catalogo"),{SERVICIOS:[]})],
  ["Crear solicitud con estado Aceptada","denegado",()=>setDoc(doc(db,"solicitudes","A"+id),{...base(uid),estado:"Aceptada"})],
  ["Crear solicitud con tipo Generalizada","denegado",()=>setDoc(doc(db,"solicitudes","B"+id),{...base(uid),tipo:"Generalizada"})],
  ["Crear solicitud con un campo no permitido","denegado",()=>setDoc(doc(db,"solicitudes","C"+id),{...base(uid),admin:true})],
  ["Crear solicitud a nombre de otra persona","denegado",()=>setDoc(doc(db,"solicitudes","D"+id),{...base("otro-uid")})],
  ["Crear solicitud con fecha inválida","denegado",()=>setDoc(doc(db,"solicitudes","E"+id),{...base(uid),fechaPreferida:"mañana"})],
  ["Pedir acceso al equipo siendo anónimo","denegado",()=>setDoc(doc(db,"accesos",uid),{nombre:"x",correo:"x",createdAt:serverTimestamp()})],
  ["Escribir disponibilidad","denegado",()=>setDoc(doc(db,"disponibilidad",uid),{a:1})],
  ["Crear una solicitud válida (médico)","permitido",()=>setDoc(doc(db,"solicitudes",id),base(uid))],
  ["Editar esa solicitud","denegado",()=>updateDoc(doc(db,"solicitudes",id),{estado:"Aceptada"})],
  ["Borrar esa solicitud","denegado",()=>deleteDoc(doc(db,"solicitudes",id))]
 ];
 let bien=0;
 for(const [nom,esp,fn] of casos){const r=await intento(fn);const ok=r===esp;if(ok)bien++;
  t.insertAdjacentHTML("beforeend",`<tr><td>${nom}</td><td>esperado: ${esp}</td><td>obtenido: ${r}</td><td class="${ok?"ok":"mal"}">${ok?"✔":"✘"}</td></tr>`);}
 res.innerHTML=`${bien} de ${casos.length} correctas`+(bien===casos.length?" — las reglas se comportan como se diseñaron.":` — hay ${casos.length-bien} que no coinciden: mándele la captura a Claude.`)+`<br><small>Quedó una solicitud de prueba (${id}); bórrela desde Firestore → Datos.</small>`;
};
</script></body></html>
