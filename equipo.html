<body>
<header><div class="wrap"><div><small>Hospital Puerto Montt · Oferta Ambulatoria</small><h1>Solicitudes de apoyo</h1></div><div id="hdr"></div></div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<script type="module">
import { firebaseConfig } from "./config.js?v=2";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { initializeFirestore, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, collection, query, orderBy, limit, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ESTADOS = ["Solicitada", "Por confirmar", "Aceptada", "Realizada", "Rechazada"];
const COLOR = { "Solicitada": "var(--s-sol)", "Por confirmar": "var(--s-con)", "Aceptada": "var(--s-ace)", "Realizada": "var(--s-rea)", "Rechazada": "var(--s-rec)" };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const app$ = document.getElementById("app"), hdr$ = document.getElementById("hdr");
const fb = initializeApp(firebaseConfig), auth = getAuth(fb), db = initializeFirestore(fb, { experimentalAutoDetectLongPolling: true });
const GESTORES_BASE = ["Katherine Valverde","Luis Gallardo","Andrea Leiva","Paulo Muñoz","Enrique Pizarro","Álan Bazán"];
auth.languageCode = "es";
const S = { fx: "", pk: "", mailP: null, corr: { tpl: "recibida", fecha: "", nota: "", cuerpo: "" }, rf: { n: "", e: "" }, reg: false, accSent: false, pers: { acc: [], eq: [], ok: false }, mes: new Date(), dia: "", orden: "antiguas", fg: "", fsv: "", gestores: GESTORES_BASE.slice(), user: null, perfil: null, listo: false, view: "list", sel: null, docs: [], f: "Todas", q: "", err: "", info: "", busy: false, form: {}, unsub: null };

const fecha = t => { try { const d = t && t.toDate ? t.toDate() : null; return d ? d.toLocaleString("es-CL", { dateStyle: "medium", timeStyle: "short" }) : ""; } catch (e) { return ""; } };
const puedeEditar = () => S.perfil && ["admin", "soporte"].includes(S.perfil.rol);
const ERRS = {
  "auth/email-already-in-use": "Ese correo ya tiene cuenta. Vuelve e ingresa, o usa «Olvidé mi contraseña».", "auth/weak-password": "La contraseña es muy corta: usa al menos 6 caracteres.",
  "auth/invalid-credential": "Correo o contraseña incorrectos.", "auth/wrong-password": "Correo o contraseña incorrectos.",
  "auth/user-not-found": "Correo o contraseña incorrectos.", "auth/invalid-email": "El correo no es válido.",
  "auth/too-many-requests": "Demasiados intentos. Espere unos minutos o restablezca su contraseña.",
  "auth/network-request-failed": "Sin conexión. Revise su internet.",
  "auth/operation-not-allowed": "El ingreso con correo y contraseña aún no está habilitado en el proyecto.",
  "auth/user-disabled": "Esta cuenta está deshabilitada."
};
const errAuth = e => ERRS[e && e.code] || ("No se pudo ingresar (" + ((e && e.code) || "error") + ").");

async function ingresar(correo, clave) {
  S.busy = true; S.err = ""; render();
  try { await signInWithEmailAndPassword(auth, correo.trim(), clave); } catch (e) { S.err = errAuth(e); }
  S.busy = false; render();
}
const OJO = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`, OJO_X = `<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.1-5.9M9.9 5.1A10.4 10.4 0 0 1 12 5c7 0 11 7 11 7a19.9 19.9 0 0 1-3.2 4.2M1 1l22 22M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>`;
const ojito = id => `<button type="button" class="eye" data-eye="${id}" aria-label="Mostrar contraseña" aria-pressed="false">${OJO}</button>`;
function bindOjos() {
  app$.querySelectorAll("[data-eye]").forEach(b => b.onclick = () => {
    const i = document.getElementById(b.dataset.eye), ver = i.type === "password";
    i.type = ver ? "text" : "password"; b.innerHTML = ver ? OJO_X : OJO; b.setAttribute("aria-pressed", String(ver)); b.setAttribute("aria-label", ver ? "Ocultar contraseña" : "Mostrar contraseña");
  });
}
const limpiaNombre = v => String(v || "").toUpperCase().normalize("NFD").replace(/N\u0303/g, "\u00D1").replace(/[\u0300-\u036f]/g, "").normalize("NFC").replace(/\s{2,}/g, " ");
async function registrar(nombre, correo, clave) {
  S.err = ""; S.info = "";
  nombre = limpiaNombre(nombre).trim(); correo = correo.trim().toLowerCase(); S.rf = { n: nombre, e: correo };
  if (nombre.length < 3) { S.err = "Escribe tu nombre completo."; render(); return; }
  if (!/^\S+@\S+\.\S+$/.test(correo)) { S.err = "El correo no es válido."; render(); return; }
  if (clave.length < 6) { S.err = "La contraseña debe tener al menos 6 caracteres."; render(); return; }
  S.busy = true; render();
  try {
    const c = await createUserWithEmailAndPassword(auth, correo, clave);
    await setDoc(doc(db, "accesos", c.user.uid), { nombre: nombre.slice(0, 120), correo: correo.slice(0, 120), createdAt: serverTimestamp() });
    S.accSent = true; S.reg = false;
  } catch (e) { S.err = errAuth(e); }
  S.busy = false; render();
}
async function pedirAcceso() {
  S.err = ""; S.busy = true; render();
  try { await setDoc(doc(db, "accesos", S.user.uid), { nombre: (S.user.displayName || S.user.email || "Sin nombre").slice(0, 120), correo: (S.user.email || "").slice(0, 120), createdAt: serverTimestamp() }); S.accSent = true; }
  catch (e) { S.err = (e && e.code === "permission-denied") ? "Ya habías enviado tu solicitud. Avisa a un administrador." : "No se pudo enviar (" + ((e && e.code) || "error") + ")."; }
  S.busy = false; render();
}
async function cargarPersonas() {
  S.err = "";
  try {
    const [a, e] = await Promise.all([getDocs(collection(db, "accesos")), getDocs(collection(db, "equipo"))]);
    S.pers.acc = a.docs.map(d => ({ uid: d.id, ...d.data() })).sort((x, y) => (x.createdAt && x.createdAt.toMillis ? x.createdAt.toMillis() : 0) - (y.createdAt && y.createdAt.toMillis ? y.createdAt.toMillis() : 0));
    S.pers.eq = e.docs.map(d => ({ uid: d.id, ...d.data() })).sort((x, y) => String(x.nombre).localeCompare(String(y.nombre)));
    S.pers.ok = true; refrescarGestores();
  } catch (x) { S.err = "No se pudo cargar (" + ((x && x.code) || "error") + ")."; }
  render();
}
function refrescarGestores() {
  const extra = S.pers.eq.filter(p => Array.isArray(p.funciones) && p.funciones.includes("gestor") && p.nombre).map(p => p.nombre);
  S.gestores = [...new Set([...GESTORES_BASE, ...extra])];
}
const ROL_TXT = r => r === "admin" ? "Administrador" : "Gestor";
function abrirCorreoAcceso(a, tipo, rol) { S.mailP = { uid: a.uid, tipo, nombre: a.nombre, correo: a.correo, rol: rol || "soporte" }; }
async function aprobar(uid, rol) {
  const a = S.pers.acc.find(x => x.uid === uid); if (!a) return;
  S.busy = true; S.err = ""; S.info = ""; render();
  try {
    await setDoc(doc(db, "equipo", uid), { nombre: a.nombre, correo: a.correo, rol, funciones: ["gestor"] });
    try { await updateDoc(doc(db, "accesos", uid), { estado: "Aprobada", resueltoPor: S.perfil.nombre || S.user.email, resueltoAt: serverTimestamp() }); } catch (e2) { S.info = "Acceso otorgado, pero falta publicar las reglas nuevas para dejar el historial. "; }
    S.info += a.nombre + " ahora tiene acceso como " + ROL_TXT(rol) + ". Abajo tienes el correo para avisarle.";
    abrirCorreoAcceso(a, "aprobada", rol);
  } catch (e) { S.err = "No se pudo aprobar (" + ((e && e.code) || "error") + ")."; }
  S.busy = false; await cargarPersonas();
}
async function descartar(uid) {
  const a = S.pers.acc.find(x => x.uid === uid); if (!a) return;
  S.err = ""; S.info = "";
  try {
    await updateDoc(doc(db, "accesos", uid), { estado: "Descartada", resueltoPor: S.perfil.nombre || S.user.email, resueltoAt: serverTimestamp() });
    S.info = "Solicitud marcada como descartada. Queda en el historial."; abrirCorreoAcceso(a, "descartada");
  } catch (e) { S.err = (e && e.code === "permission-denied") ? "Para guardar las descartadas hay que publicar las reglas nuevas (firestore.rules en el repositorio)." : "No se pudo descartar (" + ((e && e.code) || "error") + ")."; }
  await cargarPersonas();
}
async function reabrir(uid) {
  S.err = ""; S.info = "";
  try { await updateDoc(doc(db, "accesos", uid), { estado: "Pendiente", resueltoPor: S.perfil.nombre || S.user.email, resueltoAt: serverTimestamp() }); S.info = "Listo: la solicitud volvió a pendientes."; }
  catch (e) { S.err = (e && e.code === "permission-denied") ? "Para deshacer hay que publicar las reglas nuevas (firestore.rules en el repositorio)." : "No se pudo deshacer (" + ((e && e.code) || "error") + ")."; }
  await cargarPersonas();
}
function correoAcceso() {
  const m = S.mailP, firma = (S.perfil && S.perfil.nombre) || "Equipo de apoyo", pie = `\n\nSaludos cordiales,\n${firma}\nApoyo a la Gestión de la Oferta Ambulatoria\nHospital Puerto Montt`;
  if (m.tipo === "aprobada") return { asunto: "Su acceso al sistema de solicitudes de apoyo está habilitado", cuerpo: `Estimado/a ${m.nombre}:\n\nSu acceso al sistema de solicitudes de apoyo (Oferta Ambulatoria HPM) fue aprobado con el rol de ${ROL_TXT(m.rol)}.\n\nPuede ingresar en ${URL_SITIO}/equipo.html con su correo y la contraseña que creó. Si no la recuerda, use la opción «Olvidé mi contraseña».${pie}` };
  return { asunto: "Sobre su solicitud de acceso al sistema de apoyo", cuerpo: `Estimado/a ${m.nombre}:\n\nRevisamos su solicitud de acceso al sistema de solicitudes de apoyo y por ahora no podemos habilitarla.\n\nSi cree que se trata de un error, o necesita acceso por un motivo específico, responda este correo y lo revisamos.${pie}` };
}
async function guardarPersona(uid, rol, funciones) {
  S.busy = true; S.err = ""; S.info = ""; render();
  try { await updateDoc(doc(db, "equipo", uid), { rol, funciones }); S.info = "Cambios guardados."; } catch (e) { S.err = "No se pudo guardar (" + ((e && e.code) || "error") + ")."; }
  S.busy = false; await cargarPersonas();
}
async function quitarPersona(uid) { try { await deleteDoc(doc(db, "equipo", uid)); S.info = "Acceso retirado."; } catch (e) { S.err = "No se pudo quitar (" + ((e && e.code) || "error") + ")."; } await cargarPersonas(); }

async function recuperar(correo) {
  S.err = ""; S.info = "";
  if (!correo.trim()) { S.err = "Escriba su correo y vuelva a pulsar «Olvidé mi contraseña»."; render(); return; }
  try { await sendPasswordResetEmail(auth, correo.trim()); } catch (e) { /* no revelar si existe */ }
  S.info = "Si ese correo tiene cuenta, le enviamos un mensaje para crear una contraseña nueva. Revise también la carpeta de correo no deseado."; render();
}

onAuthStateChanged(auth, async u => {
  if (S.unsub) { S.unsub(); S.unsub = null; }
  S.user = u; S.perfil = null; S.docs = []; S.view = "list"; S.sel = null; S.listo = false; S.err = "";
  if (u) {
    try { const s = await getDoc(doc(db, "equipo", u.uid)); S.perfil = s.exists() ? s.data() : null; } catch (e) { S.perfil = null; }
    if (S.perfil) { try { await updateDoc(doc(db, "equipo", u.uid), { ultimoIngreso: serverTimestamp() }); } catch (e) {} }
    if (S.perfil && S.perfil.rol === "admin") {
      try {
        const q = await getDocs(collection(db, "equipo")); const extra = [];
        q.forEach(x => { const d = x.data(); if (Array.isArray(d.funciones) && d.funciones.includes("gestor") && d.nombre) extra.push(d.nombre); });
        S.gestores = [...new Set([...GESTORES_BASE, ...extra])];
        S.pers.eq = q.docs.map(d => ({ uid: d.id, ...d.data() }));
        try { const a = await getDocs(collection(db, "accesos")); S.pers.acc = a.docs.map(d => ({ uid: d.id, ...d.data() })); } catch (e2) {}
      } catch (e) {}
    }
    if (S.perfil) {
      S.unsub = onSnapshot(query(collection(db, "solicitudes"), orderBy("createdAt", "desc"), limit(300)),
        snap => { S.docs = snap.docs.map(d => ({ id: d.id, ...d.data() })); S.listo = true; if (S.view === "list" || S.view === "panel") render(); },
        e => { S.err = "No se pudieron cargar las solicitudes (" + ((e && e.code) || "error") + ")."; S.listo = true; render(); });
    }
  }
  S.listo = !u || !S.perfil ? true : S.listo;
  render();
});

const ms = t => { try { return t && t.toMillis ? t.toMillis() : Date.now(); } catch (e) { return Date.now(); } };
const dias = t => Math.max(0, Math.floor((Date.now() - ms(t)) / 864e5));
const hace = t => { const n = dias(t); return n === 0 ? "hoy" : n === 1 ? "hace 1 día" : "hace " + n + " días"; };
const corta = t => { try { const d = t && t.toDate ? t.toDate() : null; return d ? d.toLocaleDateString("es-CL", { day: "2-digit", month: "2-digit", year: "numeric" }) : "—"; } catch (e) { return "—"; } };
function filtradas() {
  const q = norm(S.q).trim();
  const out = S.docs.filter(d => (S.f === "Todas" || d.estado === S.f) && fxOk(d) &&
    (!S.fg || (S.fg === "__sin" ? !d.gestor : d.gestor === S.fg)) &&
    (!S.fsv || d.servicio === S.fsv) &&
    (!q || norm([d.id, d.tema, d.solicitante, d.especialidad, d.servicio, d.contacto, d.gestor].join(" ")).includes(q)));
  const pref = d => (d.fechaPreferida || "9999") + " " + (d.horaPreferida || "");
  out.sort(S.orden === "recientes" ? (a, b) => ms(b.createdAt) - ms(a.createdAt)
    : S.orden === "preferida" ? (a, b) => pref(a).localeCompare(pref(b))
    : (a, b) => ms(a.createdAt) - ms(b.createdAt));
  return out;
}

function exportar() {
  const cols = ["id","estado","tipo","servicio","especialidad","tema","solicitante","contacto","fechaPreferida","horaPreferida","prioridad","modalidad","participantes","lugar","observacion","gestor","notaInterna","mensajePublico","createdAt"];
  const q = v => '"' + String(v ?? "").replace(/"/g, '""').replace(/\r?\n/g, " ") + '"';
  const lines = [cols.join(";")].concat(S.docs.map(d => cols.map(c => q(c === "createdAt" ? fecha(d.createdAt) : d[c])).join(";")));
  const blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "solicitudes-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

async function guardar() {
  const d = S.sel, f = S.form; S.err = ""; S.info = "";
  if (!ESTADOS.includes(f.estado)) { S.err = "Elija un estado."; render(); return; }
  S.busy = true; render();
  try {
    await updateDoc(doc(db, "solicitudes", d.id), { estado: f.estado, gestor: (f.gestor || "").trim(), notaInterna: (f.notaInterna || "").trim(), mensajePublico: (f.mensaje || "").trim(), updatedAt: serverTimestamp(), updatedBy: S.user.uid });
    let aviso = "";
    try { await setDoc(doc(db, "seguimiento", d.id), { estado: f.estado, mensaje: (f.mensaje || "").trim(), actualizado: serverTimestamp() }); }
    catch (e) { aviso = " Pero no se pudo actualizar lo que ve el médico en el seguimiento (" + ((e && e.code) || "error") + ")."; }
    S.corr.tpl = PLANTILLA_POR_ESTADO[f.estado] || S.corr.tpl; Object.assign(d, { estado: f.estado, gestor: (f.gestor || "").trim(), notaInterna: (f.notaInterna || "").trim(), mensajePublico: (f.mensaje || "").trim() });
    S.info = "Guardado." + aviso;
  } catch (e) { S.err = "No se pudo guardar (" + ((e && e.code) || "error") + ")."; }
  S.busy = false; render();
}

}
const FX_TXT = { abiertas: "Abiertas (por atender)", singestor: "Abiertas sin gestor asignado", viejas: "Abiertas con más de 7 días de espera", atendidas: "Atendidas (aceptadas o realizadas)" };
function irALista(spec) {

const fxOk = d => {
  if (!S.fx) return true;
  const abierta2 = abierta(d), x = dias(d.createdAt);
  if (S.fx === "abiertas") return abierta2;
  if (S.fx === "singestor") return abierta2 && !d.gestor;
  if (S.fx === "viejas") return abierta2 && x > 7;
  if (S.fx === "atendidas") return d.estado === "Aceptada" || d.estado === "Realizada";
  if (S.fx.startsWith("edad:")) { const [, a, b] = S.fx.split(":"); return abierta2 && x >= +a && x <= +b; }
  return true;
};

function abrir(id) { S.vuelta = S.view === "panel" ? "panel" : "list"; S.sel = S.docs.find(d => d.id === id); S.corr = { tpl: PLANTILLA_POR_ESTADO[S.sel.estado] || "recibida", fecha: "", nota: "", cuerpo: "" }; S.form = { estado: S.sel.estado, gestor: S.sel.gestor || "", notaInterna: S.sel.notaInterna || "", mensaje: S.sel.mensajePublico || "" }; S.view = "detail"; S.err = ""; S.info = ""; render(); window.scrollTo(0, 0); }
const pendientes = () => { const ids = new Set(S.pers.eq.map(p => p.uid)); return S.pers.acc.filter(a => (!a.estado || a.estado === "Pendiente") && !ids.has(a.uid)); };

  app$.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { S.pk = S.pk === b.dataset.k ? "" : b.dataset.k; render(); });

function render() {
